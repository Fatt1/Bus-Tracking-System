<!DOCTYPE html>
<html>
<head><title>Test JWT</title></head>
<body>
<h3>JWT Token Tester</h3>
<textarea id="token" placeholder="Paste token here" style="width:100%;height:100px"></textarea>
<button onclick="decodeToken()">Decode</button>
<pre id="result"></pre>
<script>
function decodeToken() {
  const token = document.getElementById('token').value;
  const parts = token.split('.');
  if (parts.length < 2) {
    document.getElementById('result').textContent = 'Invalid token';
    return;
  }
  const payload = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')));
  document.getElementById('result').textContent = JSON.stringify(payload, null, 2);
}
</script>
</body>
</html>
